<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monolith meter · World entry</title>
<style>
:root {
  --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --line: #27272a;
  --accent: #10b981; --focus: #d4d4d8; --error-text: #fca5a5;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { display: grid; place-items: center; min-height: 100vh; }
main { width: min(440px, 88vw); display: grid; gap: 20px; }
.kicker { margin: 0; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: 20px; font-weight: 600; }
.track { position: relative; height: 2px; background: var(--line); overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--accent); transition: width 400ms ease-out; }
.row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { min-height: 40px; margin: 0; font-size: 14px; color: var(--muted); }
.note.error { color: var(--error-text); }
button { font: inherit; font-size: 14px; height: 36px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--fg); color: #18181b; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button[hidden] { display: none; }
.preview { display: flex; gap: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.preview button { height: 28px; padding: 0 10px; font-size: 12px; background: transparent; color: var(--muted); border: 1px solid var(--line); }
.preview button[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
.caption { margin: 0; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<main aria-labelledby="title">
  <p class="kicker">World · entry</p>
  <h1 id="title">Preparing the house</h1>
  <div class="track" role="progressbar" aria-label="World loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="fill" id="fill"></div>
  </div>
  <div class="row"><span id="phase">Loading scene</span><span id="pct">0%</span></div>
  <p class="note" id="note" aria-live="polite"></p>
  <button id="enter" type="button" hidden>Enter world</button>
  <div class="preview" role="group" aria-label="Preview states">
    <button type="button" data-state="loading" aria-pressed="true">Loading</button>
    <button type="button" data-state="ready" aria-pressed="false">Ready</button>
    <button type="button" data-state="error" aria-pressed="false">Error</button>
  </div>
  <p class="caption">Preview only: the counter is simulated, never real loading telemetry.</p>
</main>
<script>
const fill = document.getElementById("fill");
const bar = fill.parentElement;
const pct = document.getElementById("pct");
const phase = document.getElementById("phase");
const note = document.getElementById("note");
const enter = document.getElementById("enter");
let value = 0;
let timer;

function paint(v, label) {
  value = v;
  fill.style.width = v + "%";
  bar.setAttribute("aria-valuenow", String(v));
  pct.textContent = v + "%";
  phase.textContent = label;
}

function show(state) {
  clearInterval(timer);
  document.querySelectorAll("[data-state]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.state === state)));
  note.classList.remove("error");
  enter.hidden = true;
  if (state === "ready") {
    paint(100, "Ready");
    note.textContent = "The house is assembled. Enter when you are ready.";
    enter.hidden = false;
    return;
  }
  if (state === "error") {
    paint(value, "Stopped");
    note.classList.add("error");
    note.textContent = "The scene could not load. Check the connection and retry.";
    return;
  }
  // Simulated: stops at 99 until the real readiness signal arrives.
  paint(0, "Loading scene");
  note.textContent = "";
  timer = setInterval(() => {
    if (value >= 99) return clearInterval(timer);
    paint(Math.min(99, value + 1), value < 60 ? "Loading scene" : "Finishing the first frame");
  }, 60);
}

document.querySelectorAll("[data-state]").forEach((b) =>
  b.addEventListener("click", () => show(b.dataset.state)));
show("loading");
</script>
</body>
</html>
