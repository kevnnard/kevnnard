<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery home · Collection rail</title><style>:root{color-scheme:dark;--bg:#09090b;--surface:#18181b;--panel:#27272a;--fg:#fafafa;--muted:#a1a1aa;--ring:#d4d4d8;--signal:#10b981}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--ring);outline-offset:3px}.stage{height:100svh;min-height:900px;position:relative;overflow:hidden;background:var(--surface)}.room{position:absolute;inset:0;width:100%;height:100%}.top{position:absolute;inset:24px 24px auto;display:flex;justify-content:space-between;align-items:start;gap:12px}.top a,.top span{padding:8px 12px;border:1px solid var(--panel);border-radius:8px;background:var(--bg);color:var(--fg);text-decoration:none}.top span,.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.anchors{position:absolute;inset:0;pointer-events:none}.anchor{position:absolute;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ring);color:var(--fg);background:var(--bg);font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.anchor.active{border-color:var(--signal);color:var(--signal)}.a1{left:58%;top:42%}.a2{left:72%;top:43%}.a3{left:86%;top:44%}.rail{position:absolute;bottom:20px;left:24px;right:24px;background:var(--bg);border:1px solid var(--panel);border-radius:12px;padding:16px 24px;display:grid;grid-template-columns:240px 1fr;gap:24px}.intro p{margin:4px 0 0;color:var(--muted);font-size:12px}.intro h1{font-size:20px;margin:4px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tab{min-height:104px;text-align:left;border:1px solid var(--panel);border-radius:8px;background:var(--surface);padding:12px}.tab:hover,.tab[aria-selected=true]{border-color:var(--ring);background:var(--panel)}.tab[aria-selected=true]{border-left:3px solid var(--signal)}.tab .index{display:block;color:var(--signal);margin-bottom:6px}.tab strong,.tab small{display:block}.tab small{color:var(--muted);font-size:12px;margin-top:3px}.status{grid-column:2;min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.status button{border:1px solid var(--ring);border-radius:6px;background:var(--surface);min-height:36px;padding:6px 12px;white-space:nowrap}.status button:hover{background:var(--panel)}@media(max-width:700px){.stage{min-height:780px}.room{width:185%;left:-47%}.top{inset:16px 16px auto}.top span{max-width:155px;text-align:right}.rail{left:16px;right:16px;bottom:16px;padding:12px;display:block}.intro h1{font-size:16px}.intro p{display:none}.tabs{gap:4px;margin-top:12px}.tab{padding:8px;min-height:80px}.tab small{display:none}.tab strong{font-size:12px}.status{margin-top:10px;font-size:11px}.anchors{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}</style></head><body><main class="stage"><svg class="room" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Schematic oblique room view: speakers and screens at left, three museum cases behind the sofa at right; the lower rail stays separate from the 3D scene."><defs><g id="box"><path d="M0 0 96 11V130L0 119Z" fill="#09090b" stroke="#a1a1aa"/><path d="M8 5 88 14V82L8 75Z" fill="#27272a" stroke="#d4d4d8"/><path d="M10 89 87 98" stroke="#10b981" stroke-width="2"/></g><g id="sound"><rect width="74" height="125" rx="6" fill="#09090b" stroke="#a1a1aa"/><circle cx="37" cy="45" r="18" fill="#27272a" stroke="#d4d4d8"/><circle cx="37" cy="90" r="25" fill="#27272a" stroke="#a1a1aa"/></g></defs><rect width="1440" height="900" fill="#18181b"/><path d="M0 120 1020 70 1440 155V650L280 600 0 548Z" fill="#27272a"/><path d="M0 pan class="index mono">02 / CENTER</span><strong>Fox V1</strong><small>Provisional geometry</small></button><button id="tab-3" class="tab" role="tab" aria-selected="false" aria-controls="case-detail" data-index="3"><span class="index mono">03 / RIGHT</span><strong>Air Jordan 1</strong><small>Black/sail stand-in</small></button></div><div class="status" id="case-detail" role="tabpanel" aria-labelledby="tab-1"><span id="detail">A credited generic helmet in Rams colors, not the exact Schutt.</span><button id="inspect" type="button">Inspect case →</button></div></section></main><script>const tabs=[...document.querySelectorAll('[role=tab]')],anchors=[...document.querySelectorAll('.anchor')],details=['A credited generic helmet in Rams colors, not the exact Schutt.','The Fox V1 is a provisional sculpt while an authorized model is unavailable.','Credited Air Jordan 1 pair; black/sail is not the exact Black Toe.'];let selected=0;function select(n){selected=n;tabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===n));tab.tabIndex=i===n?0:-1});anchors.forEach((anchor,i)=>anchor.classList.toggle('active',i===n));document.querySelector('#detail').textContent=details[n];document.querySelector('#case-detail').setAttribute('aria-labelledby',tabs[n].id)}tabs.forEach((tab,i)=>{tab.tabIndex=i? -1:0;tab.addEventListener('click',()=>select(i));tab.addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();select((i+(event.key==='ArrowRight'?1:2))%3);tabs[selected].focus()}})});document.querySelector('#inspect').onclick=()=>{document.querySelector('#detail').textContent='Design preview: selecting this case would move the live camera to the chosen urn.'};</script></body></html>
